name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: DockerHub Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

      - name: Stop and remove old container
        run: |
          docker stop pubg-api || true
          docker rm pubg-api || true
          docker rmi smw0807/pubg-api:1.0.0 || true

      - name: Pull latest image
        run: docker pull smw0807/pubg-api:1.0.0

      - name: Run new container
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          PROJECT_PORT: ${{ secrets.PROJECT_PORT }}
          PUBG_API_URL: ${{ secrets.PUBG_API_URL }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          CORS_METHODS: ${{ secrets.CORS_METHODS }}
          CORS_ALLOWED_HEADERS: ${{ secrets.CORS_ALLOWED_HEADERS }}
        run: |
          docker run -d \
            --name pubg-api \
            --restart always \
            -e PROJECT_NAME=$PROJECT_NAME \
            -e PROJECT_PORT=$PROJECT_PORT \
            -e PUBG_API_URL=$PUBG_API_URL \
            -e PUBG_API_KEY=$PUBG_API_KEY \
            -e CORS_ORIGIN=$CORS_ORIGIN \
            -e CORS_METHODS=$CORS_METHODS \
            -e CORS_ALLOWED_HEADERS=$CORS_ALLOWED_HEADERS \
            -p 3000:3000 \
            smw0807/pubg-api:1.0.0
